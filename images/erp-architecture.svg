<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="11">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- 모노레포 -->
  <rect x="14" y="18" width="470" height="150" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-dasharray="4 3"/>
  <text x="28" y="38" font-weight="700" fill="#374151">pnpm · Turborepo 모노레포 (TypeScript 단일 언어)</text>

  <g stroke="#2563eb" stroke-width="1.2" fill="#fff">
    <rect x="28" y="54" width="190" height="96" rx="8" fill="#eff6ff"/>
    <rect x="282" y="54" width="186" height="96" rx="8" fill="#eff6ff"/>
  </g>
  <g fill="#111">
    <text x="123" y="74" font-weight="700" text-anchor="middle" fill="#1d4ed8">apps/web</text>
    <text x="123" y="92" font-size="10" text-anchor="middle" fill="#374151">Next.js 16 App Router · React 19</text>
    <text x="123" y="107" font-size="10" text-anchor="middle" fill="#374151">TanStack Query · Zustand · Tailwind 4</text>
    <text x="123" y="122" font-size="10" text-anchor="middle" fill="#374151">zod 검증 · Playwright E2E 12</text>
    <text x="123" y="139" font-size="9.5" text-anchor="middle" fill="#6b7280">라우트 26 · 컴포넌트 88</text>

    <text x="375" y="74" font-weight="700" text-anchor="middle" fill="#1d4ed8">apps/api</text>
    <text x="375" y="92" font-size="10" text-anchor="middle" fill="#374151">NestJS 11 · REST · Prisma 6</text>
    <text x="375" y="107" font-size="10" text-anchor="middle" fill="#374151">자체 인증(JWT access + refresh)</text>
    <text x="375" y="122" font-size="10" text-anchor="middle" fill="#374151">Slack 연동(계정 동기화·알림)</text>
    <text x="375" y="139" font-size="9.5" text-anchor="middle" fill="#6b7280">모듈 16: 결재·휴가·근태·증명서·조직…</text>
  </g>
  <path d="M218 102 L282 102" stroke="#2563eb" stroke-width="1.4" fill="none" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="250" y="96" font-size="9" fill="#1d4ed8" text-anchor="middle">REST</text>
  <text x="250" y="160" font-size="9.5" fill="#6b7280" text-anchor="middle">packages/shared: 타입·스키마 공유</text>

  <!-- DB -->
  <g>
    <path d="M520 62 a40 10 0 0 1 80 0 v70 a40 10 0 0 1 -80 0 z" fill="#fff" stroke="#111" stroke-width="1.4"/>
    <ellipse cx="560" cy="62" rx="40" ry="10" fill="#fff" stroke="#111" stroke-width="1.4"/>
    <text x="560" y="100" font-weight="700" text-anchor="middle">MySQL 8</text>
    <text x="560" y="162" font-size="9.5" fill="#6b7280" text-anchor="middle">Prisma 마이그레이션</text>
  </g>
  <path d="M468 102 L518 102" stroke="#2563eb" stroke-width="1.4" fill="none" marker-end="url(#a)"/>

  <!-- 마이그레이션 -->
  <g>
    <rect x="632" y="54" width="114" height="96" rx="8" fill="#fff" stroke="#e5e7eb"/>
    <text x="689" y="78" font-size="10" font-weight="700" fill="#374151" text-anchor="middle">기존 그룹웨어</text>
    <text x="689" y="94" font-size="9.5" fill="#4b5563" text-anchor="middle">export 데이터</text>
    <text x="689" y="118" font-size="9.5" fill="#4b5563" text-anchor="middle">조직·휴가 잔여</text>
    <text x="689" y="132" font-size="9.5" fill="#4b5563" text-anchor="middle">→ 마이그레이션</text>
  </g>
  <path d="M632 102 L602 102" stroke="#9ca3af" stroke-width="1.2" fill="none" stroke-dasharray="3 3" marker-end="url(#a)"/>

  <!-- 인프라 -->
  <rect x="14" y="186" width="732" height="34" rx="8" fill="#fff" stroke="#9ca3af" stroke-width="1"/>
  <text x="28" y="207" font-weight="700" fill="#374151">운영</text>
  <text x="70" y="207" font-size="10.5" fill="#4b5563">Docker Compose(proxy·web·api·db·gotenberg PDF) · Bitbucket Pipelines CI(빌드·typecheck·API 테스트) · 일 1회 DB 백업 · 운영 문서 3종</text>
