<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="11">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- 메인 루프 -->
  <g stroke="#2563eb" stroke-width="1.2" fill="#fff">
    <rect x="14" y="40" width="130" height="56" rx="8"/>
    <rect x="186" y="40" width="150" height="56" rx="8" fill="#eff6ff"/>
    <rect x="378" y="40" width="130" height="56" rx="8" stroke="#111" stroke-width="1.6"/>
    <rect x="550" y="40" width="100" height="56" rx="8"/>
    <rect x="378" y="134" width="190" height="46" rx="8" fill="#eff6ff"/>
  </g>
  <g fill="#111" text-anchor="middle">
    <text x="79" y="63" font-weight="700">트리거</text>
    <text x="79" y="80" font-size="10" fill="#4b5563">프로덕션 크래시 · 이슈 시트</text>
    <text x="261" y="63" font-weight="700" fill="#1d4ed8">AI 에이전트</text>
    <text x="261" y="80" font-size="10" fill="#4b5563">분석 → 코드 작업 → PR 생성</text>
    <text x="443" y="63" font-weight="700">사람</text>
    <text x="443" y="80" font-size="10" fill="#4b5563">리뷰 · 머지만 판단</text>
    <text x="600" y="63" font-weight="700">배포</text>
    <text x="600" y="80" font-size="10" fill="#4b5563">staging → prod</text>
    <text x="473" y="153" font-weight="700" fill="#1d4ed8">이슈 상태 자동 전이</text>
    <text x="473" y="169" font-size="10" fill="#4b5563">시트 갱신 · Slack 보고</text>
  </g>
  <g stroke="#2563eb" stroke-width="1.4" fill="none" marker-end="url(#a)">
    <path d="M144 68 L186 68"/>
    <path d="M336 68 L378 68"/>
    <path d="M508 68 L550 68"/>
    <path d="M600 96 L600 157 L568 157"/>
    <path d="M378 157 L79 157 L79 96"/>
  </g>
  <text x="330" y="112" font-size="9.5" fill="#1d4ed8" text-anchor="middle">사람 리뷰 통과 시에만 반영</text>
  <text x="170" y="150" font-size="9.5" fill="#6b7280" text-anchor="middle">배포 반영 확인 → 이슈 닫힘</text>

  <!-- 워치독 -->
  <rect x="14" y="200" width="636" height="38" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="24" y="223" font-weight="700" fill="#374151">워치독</text>
  <text x="104" y="223" font-size="10.5" fill="#4b5563">파이프라인 실패 · 봇 연결 끊김 · 수집 키 오염 · 토큰 만료 → 침묵 실패 감지 시 경보 · 자동 복구</text>
  <g stroke="#9ca3af" stroke-width="1" fill="none" stroke-dasharray="3 3" marker-end="url(#g)">
    <path d="M261 200 L261 98"/>
    <path d="M600 200 L600 182"/>
  </g>

  <!-- 범위 주석 -->
  <g>
    <rect x="672" y="40" width="80" height="140" rx="8" fill="#fff" stroke="#e5e7eb"/>
    <text x="712" y="62" font-size="10" font-weight="700" fill="#374151" text-anchor="middle">루프 적용 범위</text>
    <text x="712" y="82" font-size="9.5" fill="#4b5563" text-anchor="middle">프로덕션 크래시</text>
    <text x="712" y="98" font-size="9.5" fill="#4b5563" text-anchor="middle">이슈 시트 작업</text>
    <text x="712" y="114" font-size="9.5" fill="#4b5563" text-anchor="middle">(보조 서비스)</text>
    <text x="712" y="140" font-size="9" fill="#9ca3af" text-anchor="middle">핵심 제품 코드는</text>
    <text x="712" y="154" font-size="9" fill="#9ca3af" text-anchor="middle">제외</text>
  </g>
</svg>
