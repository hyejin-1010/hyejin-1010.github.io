<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 236" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="11">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- 시작 -->
  <g stroke="#111" stroke-width="1.6" fill="#fff">
    <rect x="14" y="88" width="104" height="56" rx="8"/>
  </g>
  <g fill="#111" text-anchor="middle">
    <text x="66" y="111" font-weight="700">코드 푸시</text>
    <text x="66" y="128" font-size="10" fill="#4b5563">Bitbucket</text>
  </g>

  <!-- 분기 -->
  <g stroke="#2563eb" stroke-width="1.4" fill="none" marker-end="url(#a)">
    <path d="M118 116 L150 116 L150 50 L186 50"/>
    <path d="M150 116 L150 182 L186 182"/>
  </g>
  <text x="152" y="40" font-size="9.5" fill="#1d4ed8" text-anchor="middle">네이티브 변경</text>
  <text x="152" y="206" font-size="9.5" fill="#1d4ed8" text-anchor="middle">JS 변경</text>

  <!-- 레인 1 · 스토어 -->
  <g stroke="#2563eb" stroke-width="1.2" fill="#fff">
    <rect x="186" y="22" width="120" height="56" rx="8"/>
    <rect x="348" y="22" width="130" height="56" rx="8" fill="#eff6ff"/>
    <rect x="520" y="22" width="130" height="56" rx="8"/>
  </g>
  <g fill="#111" text-anchor="middle">
    <text x="246" y="45" font-weight="700">파이프라인 실행</text>
    <text x="246" y="62" font-size="10" fill="#4b5563">수동 트리거</text>
    <text x="413" y="45" font-weight="700" fill="#1d4ed8">Fastlane</text>
    <text x="413" y="62" font-size="10" fill="#4b5563">iOS · Android 병렬 빌드</text>
    <text x="585" y="45" font-weight="700">테스트 배포</text>
    <text x="585" y="62" font-size="10" fill="#4b5563">TestFlight · Play 내부 테스트</text>
  </g>
  <g stroke="#2563eb" stroke-width="1.4" fill="none" marker-end="url(#a)">
    <path d="M306 50 L348 50"/>
    <path d="M478 50 L520 50"/>
  </g>

  <!-- 레인 2 · OTA -->
  <g stroke="#2563eb" stroke-width="1.2" fill="#fff">
    <rect x="186" y="154" width="120" height="56" rx="8"/>
    <rect x="348" y="154" width="130" height="56" rx="8"/>
    <rect x="520" y="154" width="130" height="56" rx="8" fill="#eff6ff"/>
  </g>
  <g fill="#111" text-anchor="middle">
    <text x="246" y="177" font-weight="700">Pipelines 자동 실행</text>
    <text x="246" y="194" font-size="10" fill="#4b5563">푸시 즉시</text>
    <text x="413" y="177" font-weight="700">변경 범위 감지</text>
    <text x="413" y="194" font-size="10" fill="#4b5563">근로자앱 · 관리자앱 · 공통</text>
    <text x="585" y="177" font-weight="700" fill="#1d4ed8">Hot Updater</text>
    <text x="585" y="194" font-size="10" fill="#4b5563">번들 업로드 · 앱 재시작 시 적용</text>
  </g>
  <g stroke="#2563eb" stroke-width="1.4" fill="none" marker-end="url(#a)">
    <path d="M306 182 L348 182"/>
    <path d="M478 182 L520 182"/>
  </g>

  <!-- 결과 -->
  <g>
    <rect x="672" y="22" width="80" height="56" rx="8" fill="#fff" stroke="#e5e7eb"/>
    <text x="712" y="45" font-size="10" font-weight="700" fill="#374151" text-anchor="middle">스토어 심사</text>
    <text x="712" y="62" font-size="9.5" fill="#1d4ed8" text-anchor="middle">빌드 40 → 20분</text>
    <rect x="672" y="154" width="80" height="56" rx="8" fill="#fff" stroke="#e5e7eb"/>
    <text x="712" y="177" font-size="10" font-weight="700" fill="#374151" text-anchor="middle">심사 없음</text>
    <text x="712" y="194" font-size="9.5" fill="#1d4ed8" text-anchor="middle">1~3일 → 4분</text>
  </g>
  <g stroke="#9ca3af" stroke-width="1" fill="none" stroke-dasharray="3 3">
    <path d="M650 50 L672 50"/>
    <path d="M650 182 L672 182"/>
  </g>

  <!-- 롤백 주석 -->
  <text x="413" y="226" font-size="9.5" fill="#6b7280" text-anchor="middle">OTA는 롤백 지원을 필수 기준으로 도구 선정 · 네이티브 모듈 변경은 여전히 스토어 경로</text>
</svg>
